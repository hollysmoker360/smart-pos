version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trixx-postgres
    environment:
      POSTGRES_DB: trixx_smartpos
      POSTGRES_USER: trixx_user
      POSTGRES_PASSWORD: trixx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trixx_user -d trixx_smartpos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trixx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trixx-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trixx_smartpos
      SPRING_DATASOURCE_USERNAME: trixx_user
      SPRING_DATASOURCE_PASSWORD: trixx_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
