spring.application.name=smartpos-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:trixx_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

trixx.jwt.secret=9a61403165b84e3a3d20dce68f041793a388e6a512bf602a8314e3e3b7b20464
trixx.jwt.expiration-ms=86400000

trixx.daraja.consumer-key=${DARAJA_CONSUMER_KEY:mock_consumer_key}
trixx.daraja.consumer-secret=${DARAJA_CONSUMER_SECRET:mock_consumer_secret}
trixx.daraja.passkey=${DARAJA_PASSKEY:mock_passkey}
trixx.daraja.shortcode=${DARAJA_SHORTCODE:174379}
trixx.daraja.callback-url=${DARAJA_CALLBACK_URL:http://localhost:8080/api/v1/webhooks/daraja/stk}
trixx.daraja.mode=${DARAJA_MODE:MOCK}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
