spring:
  application:
    name: trixx-smarttrolley
  datasource:
    url: jdbc:h2:mem:trixxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

