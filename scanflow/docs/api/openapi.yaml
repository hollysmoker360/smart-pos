openapi: 3.0.3
info:
  title: ScanFlow API
  version: 1.0.0
  description: Versioned contract for implemented ScanFlow onboarding, catalogue, shopping, and cash POS endpoints. Digital payment and networked hardware APIs are not yet implemented.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/auth/me:
    get:
      summary: Return the current authenticated user and business context
      description: Requires a valid user access token. The result is loaded from the current user record, so disabled users and changed roles are not taken from stale client state.
      responses:
        '200':
          description: Current user and their business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Authentication is required
  /api/v1/auth/register:
    post:
      security: []
      deprecated: true
      summary: Development-only direct business registration
      description: Disabled when the prod Spring profile is active. Production businesses are created through a platform-admin invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectRegistrationRequest'
      responses:
        '201':
          description: Business and owner account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Open registration is disabled
  /api/v1/auth/login:
    post:
      security: []
      summary: Authenticate a user and issue a short-lived access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
  /api/v1/auth/invitations/accept:
    post:
      security: []
      summary: Accept a single-use TRIXX business invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Business and owner created; no branch is created automatically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid, expired, or already-used invitation
  /api/v1/auth/employee-invitations/accept:
    post:
      security: []
      summary: Accept a single-use employee invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Employee account created with the invited business role and branch access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid, expired, or already-used invitation
  /api/v1/platform/business-invitations:
    post:
      summary: Create a one-time business-owner invitation
      description: Requires PLATFORM_ADMIN. The returned invite URL is disclosed once for controlled delivery; the raw token is stored only as a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessInvitationRequest'
      responses:
        '201':
          description: Invitation created; expires in seven days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '403':
          description: Caller is not a platform administrator
  /api/v1/businesses/me:
    get:
      summary: Read the authenticated user's business
      responses:
        '200':
          description: Current business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
  /api/v1/businesses/me/branches:
    get:
      summary: List branches belonging to the authenticated business
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
    post:
      summary: Create a branch for the authenticated business
      description: Requires OWNER. Business identity is derived from the authenticated principal, not the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          description: Caller is not a business owner
  /api/v1/businesses/me/employee-invitations:
    post:
      summary: Invite an employee to selected branches
      description: Requires OWNER or BUSINESS_ADMIN. Every branch ID must belong to the authenticated user's business; platform and owner roles cannot be assigned through this flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeInvitationRequest'
      responses:
        '201':
          description: Single-use invitation created; its raw token is returned only in the invitation URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEmployeeInvitation'
        '400':
          description: Invalid role, input, or branch assignment
        '403':
          description: Caller is not authorized to invite employees
  /api/v1/products:
    get:
      summary: List products for the authenticated business
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Product page
    post:
      summary: Create a product in the authenticated business catalogue
      description: Requires OWNER or BRANCH_MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
  /api/v1/products/lookup:
    get:
      summary: Look up a product by SKU or barcode in the authenticated business
      parameters:
        - in: query
          name: identifier
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active product
        '400':
          description: Product not found or inactive
  /api/v1/pos/branches:
    get:
      summary: List active branches the authenticated cashier may use
      responses:
        '200':
          description: Authorized active branches
  /api/v1/shopping-sessions:
    post:
      summary: Start an authenticated shopping session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingSessionRequest'
      responses:
        '201':
          description: Shopping session created
  /api/v1/shopping-sessions/{sessionId}/items:
    post:
      summary: Add a product to a shopping session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBasketItemRequest'
      responses:
        '201':
          description: Updated basket
  /api/v1/shopping-sessions/{sessionId}/basket:
    get:
      summary: Read a shopping-session basket
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Backend-calculated basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
  /api/v1/public/branches/{branchId}:
    get:
      summary: Read public shopping capabilities for a branch
      security: []
      parameters:
        - in: path
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active branch details suitable for the store QR entry flow
  /api/v1/public/branches/{branchId}/shopping-sessions:
    post:
      summary: Start a guest phone-scanning session
      security: []
      parameters:
        - in: path
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Created session and one-time capability token
  /api/v1/public/shopping-sessions/{sessionId}/items:
    post:
      summary: Add a product to a guest session
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBasketItemRequest'
      responses:
        '201':
          description: Server-calculated basket snapshot
        '403':
          description: Session capability token is invalid
  /api/v1/public/shopping-sessions/{sessionId}/items/{itemId}:
    patch:
      summary: Update guest basket item quantity
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated server-calculated basket
    delete:
      summary: Remove guest basket item
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated server-calculated basket
  /api/v1/public/shopping-sessions/{sessionId}/basket:
    get:
      summary: Read guest basket snapshot
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Backend-calculated basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
  /api/v1/public/shopping-sessions/{sessionId}/checkout:
    post:
      summary: Complete a guest basket checkout with cash or queued digital payment
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCheckoutRequest'
      responses:
        '201':
          description: Guest checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestCheckoutResponse'
  /api/v1/public/shopping-sessions/{sessionId}/receipt:
    get:
      summary: Read the latest guest receipt and exit-token metadata
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Guest receipt
  /api/v1/public/exit-tokens/{tokenCode}/verify:
    post:
      summary: Verify a guest exit token
      security: []
      parameters:
        - in: path
          name: tokenCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Exit token verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitVerificationResponse'
  /api/v1/public/shopping-sessions/{sessionId}/events:
    get:
      summary: Stream guest basket snapshots using Server-Sent Events
      description: Events are sent as basket.snapshot after the initial snapshot and successful basket mutations. Guest session token must be supplied in X-Shopping-Session-Token.
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: header
          name: X-Shopping-Session-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/pos/checkouts:
    post:
      summary: Complete an idempotent cash POS sale
      description: Requires OWNER, BRANCH_MANAGER, or CASHIER. The server validates current prices and stock, records the order/payment/inventory movement, and updates stock. Digital payment methods are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosCheckoutRequest'
      responses:
        '201':
          description: Checkout calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosCheckoutResponse'
        '403':
          description: Caller is not authorized for cashier checkout
        '400':
          description: Invalid checkout, insufficient stock, or conflicting idempotency key
  /api/v1/pos/quotes:
    post:
      summary: Quote a cashier basket using current server prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosQuoteRequest'
      responses:
        '200':
          description: Server-calculated subtotal, tax, and total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosQuoteResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, maxLength: 72 }
    DirectRegistrationRequest:
      type: object
      required: [businessName, email, phone, ownerName, password]
      properties:
        businessName: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        ownerName: { type: string, maxLength: 255 }
        password: { type: string, minLength: 12, maxLength: 72 }
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12, maxLength: 72 }
    CreateBusinessInvitationRequest:
      type: object
      required: [businessName, ownerName, ownerEmail, ownerPhone]
      properties:
        businessName: { type: string, maxLength: 255 }
        ownerName: { type: string, maxLength: 255 }
        ownerEmail: { type: string, format: email, maxLength: 255 }
        ownerPhone: { type: string, maxLength: 50 }
    CreateEmployeeInvitationRequest:
      type: object
      required: [fullName, email, phone, role, branchIds]
      properties:
        fullName: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        role: { type: string, enum: [BUSINESS_ADMIN, BRANCH_MANAGER, CASHIER, INVENTORY_OFFICER, FINANCE_OFFICER, AUDITOR] }
        branchIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    CreatedEmployeeInvitation:
      type: object
      required: [invitationId, email, role, invitationUrl, expiresAt, branchIds]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        invitationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        branchIds:
          type: array
          items: { type: string, format: uuid }
    CreatedInvitation:
      type: object
      required: [invitationId, businessName, ownerEmail, invitationUrl, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        businessName: { type: string }
        ownerEmail: { type: string, format: email }
        invitationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        business:
          allOf:
            - $ref: '#/components/schemas/Business'
          nullable: true
        user: { $ref: '#/components/schemas/UserSummary' }
        token: { type: string }
    CurrentUser:
      type: object
      required: [user, business]
      properties:
        business:
          $ref: '#/components/schemas/Business'
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [PLATFORM_ADMIN, OWNER, BUSINESS_ADMIN, BRANCH_MANAGER, CASHIER, INVENTORY_OFFICER, FINANCE_OFFICER, AUDITOR, CUSTOMER] }
    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string }
    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        currency: { type: string, minLength: 3, maxLength: 3, default: KES }
        timezone: { type: string, maxLength: 64, default: Africa/Nairobi }
    Branch:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string }
        timezone: { type: string }
        active: { type: boolean }
    CreateProductRequest:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 255 }
        barcode: { type: string, maxLength: 128, nullable: true }
        price: { type: number, format: double, minimum: 0 }
        taxRate: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        category: { type: string, nullable: true }
    CreateShoppingSessionRequest:
      type: object
      required: [sessionType]
      properties:
        sessionType: { type: string, enum: [PHONE_SCANNING, SMART_TROLLEY, CASHIER] }
        branchName: { type: string }
    AddBasketItemRequest:
      type: object
      required: [productIdentifier, quantity]
      properties:
        productIdentifier: { type: string }
        quantity: { type: integer, minimum: 1 }
    Basket:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        totalAmount: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              productSku: { type: string }
              productName: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number }
              lineTotal: { type: number }
    GuestCheckoutRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod: { type: string, enum: [CASH, M-PESA, CARD] }
        cashReceived: { type: number, format: double }
        customerName: { type: string }
        phoneNumber: { type: string }
        idempotencyKey: { type: string }
    GuestCheckoutResponse:
      type: object
      required: [sessionId, orderId, orderNumber, orderStatus, paymentStatus, totalAmount, currency, receiptNumber]
      properties:
        sessionId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderStatus: { type: string }
        paymentStatus: { type: string }
        totalAmount: { type: number, format: double }
        currency: { type: string }
        receiptNumber: { type: string }
        exitTokenCode: { type: string, nullable: true }
        changeDue: { type: number, format: double }
    ExitVerificationResponse:
      type: object
      required: [tokenCode, orderId, status, expiresAt]
      properties:
        tokenCode: { type: string }
        orderId: { type: string, format: uuid }
        status: { type: string }
        expiresAt: { type: string, format: date-time }
    PosCheckoutRequest:
      type: object
      required: [branchId, items, idempotencyKey, paymentMethod, cashReceived]
      properties:
        branchId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, description: SKU or barcode }
              quantity: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, maxLength: 255 }
        paymentMethod: { type: string, enum: [CASH] }
        cashReceived: { type: number, minimum: 0 }
    PosCheckoutResponse:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderStatus: { type: string }
        paymentStatus: { type: string }
        paymentMethod: { type: string, enum: [CASH] }
        currency: { type: string }
        items: { type: array, items: { type: object } }
        totalAmount: { type: number, format: double }
        itemCount: { type: integer }
        cashReceived: { type: number }
        changeDue: { type: number }
    PosQuoteRequest:
      type: object
      required: [branchId, items]
      properties:
        branchId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, description: SKU or barcode }
              quantity: { type: integer, minimum: 1 }
    PosQuoteResponse:
      type: object
      properties:
        branchId: { type: string, format: uuid }
        currency: { type: string }
        subtotalAmount: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        itemCount: { type: integer }
        items: { type: array, items: { type: object } }
