spring:
  application:
    name: scanflow-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:scanflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  registration:
    open: ${APP_OPEN_REGISTRATION:true}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-for-local-development}
    expiration-ms: ${APP_JWT_EXPIRY_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
