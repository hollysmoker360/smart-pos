name: ScanFlow CI

on:
  pull_request:
    paths:
      - "scanflow/backend/**"
      - "scanflow/apps/**"
      - "scanflow/.github/workflows/**"
      - ".github/workflows/scanflow-ci.yml"
  push:
    branches: [main]
    paths:
      - "scanflow/backend/**"
      - "scanflow/apps/**"
      - "scanflow/.github/workflows/**"
      - ".github/workflows/scanflow-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: scanflow/backend/*.gradle
      - name: Run backend tests
        working-directory: scanflow/backend
        run: ./gradlew --no-daemon test
      - name: Build production container
        run: docker build --file scanflow/backend/Dockerfile scanflow/backend

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/shared/design_system
          - apps/customer_app
          - apps/smart_trolley
          - apps/business_app
          - apps/admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Resolve dependencies
        working-directory: scanflow/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: scanflow/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        working-directory: scanflow/${{ matrix.app }}
        run: flutter test
      - name: Build web app
        if: matrix.app == 'apps/business_app' || matrix.app == 'apps/admin_app'
        working-directory: scanflow/${{ matrix.app }}
        run: flutter build web --dart-define=SCANFLOW_API_BASE_URL=https://api.example.invalid/api/v1
